<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes B2B - Kambio POS</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <nav class="navbar">
        <h1>Kambio POS</h1>
        <div class="user-profile">Módulo: Clientes y Portal B2B</div>
    </nav>

    <div class="container">
        <a href="../index.html" class="btn-back">← Volver al Dashboard</a>
        
        <div class="content-box">
            <h2 style="color: var(--primary); margin-top: 0;">Registro de Empresas Afiliadas</h2>
            <p style="margin-bottom: 25px;">Gestiona las empresas con flotas vehiculares y sus líneas de crédito corporativo.</p>
            
            <form id="empresaForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="rnc">RNC de la Empresa</label>
                        <input type="text" id="rnc" required placeholder="Ej. 130123456">
                    </div>
                    <div class="form-group">
                        <label for="nombreComercial">Nombre Comercial</label>
                        <input type="text" id="nombreComercial" required placeholder="Logística Express S.R.L.">
                    </div>
                    <div class="form-group">
                        <label for="limiteCredito">Límite de Crédito Global (DOP)</label>
                        <input type="number" id="limiteCredito" step="1000" required placeholder="500000">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono de Contacto</label>
                        <input type="text" id="telefono" required placeholder="809-555-5555">
                    </div>
                </div>
                <button type="submit">Afiliar Empresa a la Red Kambio</button>
            </form>
        </div>

        <div class="content-box">
            <h3 style="color: var(--primary); margin-top: 0;">Directorio de Empresas Activas</h3>
            <table>
                <thead>
                    <tr>
                        <th>RNC</th>
                        <th>Empresa</th>
                        <th>Límite Aprobado</th>
                        <th>Balance Disponible</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaEmpresas">
                    <!-- Los datos del endpoint de clientes B2B se cargarán aquí -->
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
