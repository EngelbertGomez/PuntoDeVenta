<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kambio POS - Dashboard Principal</title>
    
    <!-- Conexión al archivo CSS global -->
    <link rel="stylesheet" href="css/global.css">
    
    <!-- Estilos específicos de las tarjetas del Dashboard (se quedan aquí porque solo aplican al index) -->
    <style>
        .dashboard-header { margin-bottom: 30px; }
        .dashboard-header h2 { margin: 0; color: var(--primary); }
        .grid-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 30px 20px; text-align: center; text-decoration: none; color: var(--text); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 2px solid transparent; transition: all 0.2s ease-in-out; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 150px; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); background-color: var(--hover-bg); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .card-icon { font-size: 40px; margin-bottom: 15px; }
        .card-title { font-size: 18px; font-weight: 600; margin: 0; }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>Kambio POS & Business Network</h1>
        <div class="user-profile">Panel de Control</div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <h2>Bienvenido al Dashboard</h2>
            <p>Selecciona un módulo para gestionar tu inventario y operaciones.</p>
        </div>

        <div class="grid-dashboard">
            <a href="pages/ventas.html" class="card">
                <div class="card-icon">🛒</div>
                <h3 class="card-title">Terminal de Ventas</h3>
            </a>
            <a href="pages/inventario.html" class="card">
                <div class="card-icon">⚙️</div>
                <h3 class="card-title">Gestión de Inventario</h3>
            </a>
            <a href="pages/clientes.html" class="card">
                <div class="card-icon">🏢</div>
                <h3 class="card-title">Clientes y B2B</h3>
            </a>
            <a href="pages/reportes.html" class="card">
                <div class="card-icon">📊</div>
                <h3 class="card-title">Reportes y Analíticas</h3>
            </a>
        </div>
    </div>

</body>
</html>
