<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kambio POS - Dashboard Principal</title>
    
    <!-- Conexión al archivo CSS global -->
    <link rel="stylesheet" href="css/global.css">
    
    <style>
        body { 
            font-family: "Segoe UI", system-ui, sans-serif; 
            background-color: #f0f4f8; /* Fondo gris azulado con más presencia */
            margin: 0; 
            color: #1e293b;
        }

        /* BARRA SUPERIOR MORADO PROFUNDO */
        .navbar {
            background-color: #312e81; /* Morado/Índigo institucional profundo */
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(49, 46, 129, 0.15);
        }
        .navbar h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff; /* Texto blanco para máximo contraste */
            letter-spacing: -0.5px;
        }
        .user-profile {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        /* HEADER DEL DASHBOARD */
        .dashboard-header { 
            margin-bottom: 45px; 
            border-left: 4px solid #4f46e5; /* Línea de acento lateral */
            padding-left: 20px;
        }
        .dashboard-header h2 { 
            margin: 0 0 6px 0; 
            font-size: 32px;
            font-weight: 800;
            color: #1e293b; 
        }
        .dashboard-header p {
            margin: 0;
            color: #64748b;
            font-size: 15px;
            font-weight: 500;
        }

        /* CUADRÍCULA DEL DASHBOARD */
        .grid-dashboard { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 30px; 
        }

        /* TARJETAS CON CONTRASTE ALTO Y DETALLES DE COLOR */
        .card { 
            background-color: #ffffff; 
            border-radius: 16px; 
            padding: 35px 25px; 
            text-decoration: none; 
            color: #1e293b; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0; 
            border-top: 5px solid #4f46e5; /* Barra superior de color en cada tarjeta */
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            min-height: 180px; 
            box-sizing: border-box;
        }

        /* Variación de colores de acento por tarjeta para dar dinamismo */
        .grid-dashboard a:nth-child(2) { border-top-color: #06b6d4; } /* Cian */
        .grid-dashboard a:nth-child(3) { border-top-color: #10b981; } /* Verde */
        .grid-dashboard a:nth-child(4) { border-top-color: #f59e0b; } /* Ámbar */
        
        /* Estados Hover */
        .card:hover { 
            transform: translateY(-6px); 
            background-color: #fafafa;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* TÍTULO DE LA TARJETA */
        .card-title { 
            font-size: 20px; 
            font-weight: 700; 
            margin: 0; 
            color: #0f172a;
        }

        /* TEXTO DE ACCIÓN INTERNA */
        .card-action {
            font-size: 13px;
            color: #4f46e5;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 20px;
        }
        
        /* Cambiar color de la acción según el acento en hover */
        .grid-dashboard a:nth-child(2) .card-action { color: #0891b2; }
        .grid-dashboard a:nth-child(3) .card-action { color: #059669; }
        .grid-dashboard a:nth-child(4) .card-action { color: #d97706; }
    </style>
</head>
<body>

    <!-- Navbar con la nueva barra morada solicitada -->
    <nav class="navbar">
        <h1>Kambio POS & Business Network</h1>
        <div class="user-profile">Usuario: Admin</div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <h2>Bienvenido al Dashboard</h2>
            <p>Selecciona un módulo para gestionar tu inventario y operaciones.</p>
        </div>

        <div class="grid-dashboard">
            <a href="pages/ventas.html" class="card">
                <div>
                    <h3 class="card-title">Terminal de Ventas</h3>
                </div>
                <div class="card-action">Ingresar al módulo →</div>
            </a>
            
            <a href="pages/inventario.html" class="card">
                <div>
                    <h3 class="card-title">Gestión de Inventario</h3>
                </div>
                <div class="card-action">Administrar stock →</div>
            </a>
            
            <a href="pages/clientes.html" class="card">
                <div>
                    <h3 class="card-title">Clientes y B2B</h3>
                </div>
                <div class="card-action">Ver cartera →</div>
            </a>
            
            <a href="pages/reportes.html" class="card">
                <div>
                    <h3 class="card-title">Reportes y Analíticas</h3>
                </div>
                <div class="card-action">Revisar métricas →</div>
            </a>
        </div>
    </div>

</body>
</html>
